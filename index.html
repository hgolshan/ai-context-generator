<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">AI Context Profile Generator</title>
    <!-- Include Vazirmatn font for crisp Persian typography -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        :root {
            --bg-color: #f6f8fa;
            --container-bg: #ffffff;
            --border-color: #d0d7de;
            --primary-color: #1f883d;
            --primary-hover: #1a7f37;
            --accent-color: #0969da;
            --accent-hover: #0860ca;
            --text-main: #24292f;
            --text-muted: #57606a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            line-height: 1.6;
        }

        /* Persian Font Override when in RTL mode */
        body[dir="rtl"] {
            font-family: Vazirmatn, Tahoma, sans-serif;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 3px 6px rgba(140,149,159,0.1);
        }

        /* Header Bar Layout */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
            gap: 12px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Compact Language Selector */
        .lang-select {
            width: auto;
            max-width: 130px;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background-color: var(--bg-color);
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        /* Responsive Mobile Behavior */
        @media (max-width: 600px) {
            .header-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            h1 {
                white-space: normal;
                font-size: 19px;
            }

            .lang-select {
                align-self: flex-start;
            }
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 14.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-main);
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            font-family: inherit;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* Output Box */
        .output-box {
            margin-top: 32px;
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-header h3 {
            margin: 0;
            font-size: 16px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
            font-size: 13px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
            direction: ltr; /* Keeps markdown code structural regardless of page language */
            text-align: left;
        }

        .btn-copy {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-copy:hover {
            background-color: var(--accent-hover);
        }

        /* Guide Section */
        .guide-section {
            margin-top: 24px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .guide-section h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-family: inherit;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .tab-content {
            display: none;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        .tab-content.active {
            display: block;
        }

        .guide-steps {
            margin: 0;
            padding-inline-start: 20px;
            font-size: 13.5px;
        }

        .guide-steps li {
            margin-bottom: 8px;
        }

        .guide-steps code {
            background: #f1f3f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            direction: ltr;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1 id="ui-title">🤖 AI Context Profile Generator</h1>
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en" selected>English</option>
            <option value="fa">فارسی</option>
        </select>
    </div>

    <p class="subtitle" id="ui-subtitle">Generate custom context instructions tailored for your daily workflows.</p>

    <form id="profileForm">
        <div class="form-group">
            <label for="role" id="ui-roleLabel">Primary Role or Domain:</label>
            <input type="text" id="role" placeholder="e.g., Senior Systems Administrator, Civil Engineer, Web Developer">
        </div>

        <div class="form-group">
            <label for="tools" id="ui-toolsLabel">Core Tools, Technologies, or Standards Used Daily:</label>
            <input type="text" id="tools" placeholder="e.g., Linux, Docker, WireGuard, IEEE Standards, AutoCAD">
        </div>

        <div class="form-group">
            <label for="tone" id="ui-toneLabel">Preferred Communication Style:</label>
            <select id="tone">
                <option value="direct" id="ui-opt-direct">Direct & Technical (No fluff, straight to solution)</option>
                <option value="educational" id="ui-opt-edu">Step-by-Step & Educational (Clear explanations)</option>
                <option value="conversational" id="ui-opt-conv">Conversational & Collaborative</option>
            </select>
        </div>

        <div class="form-group">
            <label for="constraints" id="ui-constraintsLabel">Things the AI Must ALWAYS AVOID:</label>
            <textarea id="constraints" placeholder="e.g., Do not repeat my prompt back to me, skip generic intros/outros, show complete code/configs without truncated blocks."></textarea>
        </div>

        <div class="form-group">
            <label for="mode" id="ui-modeLabel">Answering / Processing Mode:</label>
            <select id="mode">
                <option value="absolute" id="ui-opt-absolute">Absolute Mode (Direct answer immediately, no meta-talk or planning)</option>
                <option value="cot" id="ui-opt-cot">Chain-of-Thought (Show step-by-step reasoning before final output)</option>
                <option value="socratic" id="ui-opt-socratic">Socratic Mode (Ask guiding questions to lead to the solution)</option>
                <option value="critic" id="ui-opt-critic">Critical Review Mode (Analyze potential edge cases and flaws first)</option>
            </select>
        </div>

        <button type="button" class="btn-submit" id="ui-generateBtn" onclick="generateProfile()">Generate Profile</button>
    </form>

    <!-- Output Container -->
    <div class="output-box" id="outputContainer" style="display:none;">
        <div class="output-header">
            <h3 id="ui-outputTitle">Your Custom Instruction Profile:</h3>
            <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
        <pre id="outputCode"></pre>

        <!-- Where to Paste Guide -->
        <div class="guide-section">
            <h4 id="ui-guideTitle">📍 Where to Paste Your Profile:</h4>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('chatgpt')">ChatGPT</button>
                <button class="tab-btn" onclick="switchTab('claude')">Claude</button>
                <button class="tab-btn" onclick="switchTab('gemini')">Gemini</button>
            </div>

            <div id="tab-chatgpt" class="tab-content active">
                <ol class="guide-steps" id="ui-steps-chatgpt"></ol>
            </div>

            <div id="tab-claude" class="tab-content">
                <ol class="guide-steps" id="ui-steps-claude"></ol>
            </div>

            <div id="tab-gemini" class="tab-content">
                <ol class="guide-steps" id="ui-steps-gemini"></ol>
            </div>
        </div>
    </div>
</div>

<script>
let currentLangData = null;
let currentLang = 'en';

// Load language JSON asynchronously
async function changeLanguage(lang) {
    currentLang = lang;
    try {
        const response = await fetch(`./locales/${lang}.json`);
        if (!response.ok) throw new Error(`Could not load ${lang}.json`);
        currentLangData = await response.json();

        // Update direction
        const isRtl = lang === 'fa';
        document.body.dir = isRtl ? 'rtl' : 'ltr';

        // Update UI Text Elements
        document.getElementById('docTitle').innerText = currentLangData.title;
        document.getElementById('ui-title').innerText = currentLangData.title;
        document.getElementById('ui-subtitle').innerText = currentLangData.subtitle;

        document.getElementById('ui-roleLabel').innerText = currentLangData.form.roleLabel;
        document.getElementById('role').placeholder = currentLangData.form.rolePlaceholder;

        document.getElementById('ui-toolsLabel').innerText = currentLangData.form.toolsLabel;
        document.getElementById('tools').placeholder = currentLangData.form.toolsPlaceholder;

        document.getElementById('ui-toneLabel').innerText = currentLangData.form.toneLabel;
        document.getElementById('ui-opt-direct').innerText = currentLangData.form.toneOptions.direct;
        document.getElementById('ui-opt-edu').innerText = currentLangData.form.toneOptions.educational;
        document.getElementById('ui-opt-conv').innerText = currentLangData.form.toneOptions.conversational;

        document.getElementById('ui-constraintsLabel').innerText = currentLangData.form.constraintsLabel;
        document.getElementById('constraints').placeholder = currentLangData.form.constraintsPlaceholder;

        document.getElementById('ui-generateBtn').innerText = currentLangData.form.generateBtn;

        document.getElementById('ui-outputTitle').innerText = currentLangData.output.title;
        document.getElementById('copyBtn').innerText = currentLangData.output.copyBtn;
        document.getElementById('ui-guideTitle').innerText = currentLangData.guide.title;

        document.getElementById('ui-modeLabel').innerText = currentLangData.form.modeLabel;
        document.getElementById('ui-opt-absolute').innerText = currentLangData.form.modeOptions.absolute;
        document.getElementById('ui-opt-cot').innerText = currentLangData.form.modeOptions.cot;
        document.getElementById('ui-opt-socratic').innerText = currentLangData.form.modeOptions.socratic;
        document.getElementById('ui-opt-critic').innerText = currentLangData.form.modeOptions.critic;

        // Populate steps lists
        populateSteps('ui-steps-chatgpt', currentLangData.guide.steps.chatgpt);
        populateSteps('ui-steps-claude', currentLangData.guide.steps.claude);
        populateSteps('ui-steps-gemini', currentLangData.guide.steps.gemini);

        // Regenerate markdown if output container is currently visible
        if (document.getElementById('outputContainer').style.display !== 'none') {
            generateProfile();
        }

    } catch (error) {
        console.error("Language loading error:", error);
    }
}

function populateSteps(elementId, stepsArray) {
    const listContainer = document.getElementById(elementId);
    listContainer.innerHTML = '';
    stepsArray.forEach(step => {
        const li = document.createElement('li');
        li.innerHTML = step;
        listContainer.appendChild(li);
    });
}

function generateProfile() {
    if (!currentLangData) return;

    const role = document.getElementById('role').value || 'Professional';
    const tools = document.getElementById('tools').value || 'Standard tools';
    const toneVal = document.getElementById('tone').value;
    const toneText = currentLangData.form.toneOptions[toneVal];
    
    // Get Mode Value
    const modeVal = document.getElementById('mode').value;
    const modeText = currentLangData.form.modeOptions[modeVal];
    
    const constraints = document.getElementById('constraints').value || 'None specified.';

    const t = currentLangData.template;

    const markdownOutput = 
`${t.header}

${t.background}
${t.role} ${role}
${t.tools} ${tools}

${t.style}
- ${toneText}
${t.styleSub}

${t.mode}
- ${modeText}

${t.constraints}
- ${constraints}
${t.constraintsSub}`;

    document.getElementById('outputCode').innerText = markdownOutput;
    document.getElementById('outputContainer').style.display = 'block';
    document.getElementById('outputContainer').scrollIntoView({ behavior: 'smooth' });
}

function copyToClipboard() {
    const text = document.getElementById('outputCode').innerText;
    const copyBtn = document.getElementById('copyBtn');

    navigator.clipboard.writeText(text).then(() => {
        copyBtn.innerText = currentLangData.output.copiedText;
        copyBtn.style.backgroundColor = '#1f883d';
        
        setTimeout(() => {
            copyBtn.innerText = currentLangData.output.copyBtn;
            copyBtn.style.backgroundColor = '#0969da';
        }, 2000);
    });
}

function switchTab(platform) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    document.getElementById(`tab-${platform}`).classList.add('active');
    event.currentTarget.classList.add('active');
}

// Initial load
window.addEventListener('DOMContentLoaded', () => {
    changeLanguage('en');
});
</script>

</body>
</html>
